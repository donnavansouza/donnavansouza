<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">A developer's space-opera opening crawl</title>
<desc id="desc">Golden scrolling text over a starfield, introducing a quest to build fairer intelligent systems.</desc>
<defs>
  <radialGradient id="space"><stop offset="0" stop-color="#17213d"/><stop offset="1" stop-color="#050711"/></radialGradient>
  <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff3a6"/><stop offset="1" stop-color="#e8b83f"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="screen"><rect x="0" y="0" width="960" height="430" rx="18"/></clipPath>
</defs>
<g clip-path="url(#screen)">
  <rect width="960" height="430" fill="url(#space)"/>
  <g fill="#dce8ff">
    <circle cx="42" cy="52" r="1.5"/><circle cx="120" cy="98" r="1"/><circle cx="220" cy="34" r="1.3"/><circle cx="330" cy="78" r="1"/><circle cx="420" cy="30" r="1.5"/><circle cx="530" cy="88" r="1"/><circle cx="630" cy="42" r="1.2"/><circle cx="740" cy="102" r="1.5"/><circle cx="850" cy="40" r="1"/><circle cx="920" cy="120" r="1.5"/>
    <circle cx="75" cy="210" r="1"/><circle cx="180" cy="165" r="1.3"/><circle cx="275" cy="240" r="1"/><circle cx="390" cy="180" r="1.5"/><circle cx="500" cy="220" r="1"/><circle cx="610" cy="160" r="1.2"/><circle cx="710" cy="250" r="1"/><circle cx="830" cy="190" r="1.4"/><circle cx="900" cy="300" r="1"/>
  </g>
  <text x="480" y="54" text-anchor="middle" fill="#8ca6d9" font-family="monospace" font-size="15" letter-spacing="6">A TRANSMISSION FROM A DISTANT REPOSITORY</text>
  <g fill="url(#gold)" font-family="Georgia,serif" text-anchor="middle" filter="url(#glow)">
    <text x="480" y="105" font-size="32" font-weight="bold" letter-spacing="5">A DEVELOPER'S QUEST</text>
  </g>
  <g fill="#f3d46f" font-family="monospace" font-size="21" font-weight="bold" text-anchor="middle">
    <text x="480" y="143" letter-spacing="3">EPISODE I — THE FAIRNESS PROTOCOL</text>
  </g>
  <g fill="#f5d979" font-family="Georgia,serif" font-size="21" text-anchor="middle">
    <animateTransform attributeName="transform" type="translate" from="0 265" to="0 -430" dur="24s" repeatCount="indefinite"/>
    <text x="480" y="0">
      <tspan x="480" dy="0">Across the digital frontier, intelligent</tspan>
      <tspan x="480" dy="31">systems are growing more powerful.</tspan>
      <tspan x="480" dy="48">But a difficult question remains:</tspan>
      <tspan x="480" dy="31">how do we make them fair?</tspan>
      <tspan x="480" dy="58">One curious computer science student</tspan>
      <tspan x="480" dy="31">sets out to explore responsible AI,</tspan>
      <tspan x="480" dy="31">machine learning, and the craft of</tspan>
      <tspan x="480" dy="31">building software that matters.</tspan>
      <tspan x="480" dy="58">Armed with Python, experiments,</tspan>
      <tspan x="480" dy="31">an electric guitar, and an unreasonable</tspan>
      <tspan x="480" dy="31">number of side quests, Donnavan</tspan>
      <tspan x="480" dy="31">continues the journey...</tspan>
    </text>
  </g>
  <rect x="0" y="0" width="960" height="430" fill="none" stroke="#34466d" stroke-width="2"/>
</g>
</svg>